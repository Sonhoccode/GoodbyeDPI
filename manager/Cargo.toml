[package]
name = "goodbyedpi-manager"
version = "1.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
eframe = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
windows-service = "0.8.1"
ureq = { version = "2.12", features = ["json"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
winres = "0.1.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

